<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nettisivun Muokkaustyökalu PRO</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            background-color: #f0f2f5;
            user-select: none;
        }

        #control-panel {
            width: 300px;
            background-color: #2c3e50;
            color: white;
            padding: 20px;
            box-shadow: 2px 0 5px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            gap: 20px;
            z-index: 10;
            overflow-y: auto;
        }

        #control-panel h2 {
            margin-top: 0;
            font-size: 1.3rem;
            border-bottom: 2px solid #34495e;
            padding-bottom: 10px;
        }

        .tool-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 0.9rem;
            color: #bdc3c7;
            font-weight: bold;
        }

        input[type="color"] {
            width: 100%;
            height: 40px;
            border: none;
            cursor: pointer;
            border-radius: 4px;
        }

        input[type="range"], select, input[type="text"] {
            width: 100%;
            box-sizing: border-box;
            cursor: pointer;
        }

        select, input[type="text"] {
            padding: 8px;
            border-radius: 4px;
            border: none;
            background-color: #34495e;
            color: white;
            font-size: 0.9rem;
        }

        input[type="text"]::placeholder {
            color: #7f8c8d;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: auto;
            padding-top: 20px;
            border-top: 1px solid #34495e;
        }

        .grid-btns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px;
        }

        button {
            color: white;
            border: none;
            padding: 10px;
            font-size: 0.9rem;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s, opacity 0.2s;
        }

        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .btn-add { background-color: #9b59b6; }
        .btn-add:hover:not(:disabled) { background-color: #8e44ad; }
        
        #delete-btn { background-color: #e74c3c; margin-top: 5px; }
        #delete-btn:hover:not(:disabled) { background-color: #c0392b; }

        #preview-mode-btn { background-color: #e67e22; }
        #preview-mode-btn.active { background-color: #2ecc71; }

        #copy-btn { background-color: #3498db; }
        #copy-btn:hover { background-color: #2980b9; }

        #download-btn { background-color: #2ecc71; }
        #download-btn:hover { background-color: #27ae60; }

        #preview-area {
            flex-grow: 1;
            padding: 40px;
            overflow-y: auto;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        #template-container {
            width: 100%;
            max-width: 800px;
            background: white;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border-radius: 8px;
            overflow: hidden;
            user-select: text;
        }

        body:not(.preview-mode) .editable {
            cursor: pointer;
            transition: outline 0.1s ease;
            outline: 2px dashed #3498db;
            position: relative;
        }

        body:not(.preview-mode) .editable:hover {
            outline: 2px dashed #e67e22;
        }

        body:not(.preview-mode) .editable:hover::after {
            content: attr(data-name);
            position: absolute;
            top: -20px;
            left: 0;
            background: #e67e22;
            color: white;
            font-size: 0.75rem;
            padding: 2px 6px;
            border-radius: 3px 3px 0 0;
            z-index: 99;
            pointer-events: none;
            font-family: sans-serif;
            font-weight: normal;
        }

        body:not(.preview-mode) .editable.selected {
            outline: 2px solid #e74c3c !important;
        }

        .template-header {
            background-color: #34495e;
            color: white;
            padding: 30px;
            text-align: center;
        }

        .template-content {
            padding: 40px;
            color: #333;
            line-height: 1.6;
        }

        .template-box {
            background-color: #ecf0f1;
            padding: 20px;
            border-radius: 6px;
            margin: 20px 0;
        }

        .template-footer {
            background-color: #7f8c8d;
            color: white;
            text-align: center;
            padding: 15px;
            font-size: 0.85rem;
        }

        .custom-button {
            display: inline-block;
            padding: 10px 20px;
            background-color: #3498db;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            margin: 10px 0;
            text-align: center;
            border: none;
        }
        
        .custom-image {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 10px auto;
            border-radius: 4px;
        }

        let selectedElement = null;
        let isPreviewMode = false;

        // Ohjauspaneelin elementit
        const previewModeBtn = document.getElementById('preview-mode-btn');
        const selectedInfo = document.getElementById('selected-info');
        const deleteBtn = document.getElementById('delete-btn');
        const elementMediaUrl = document.getElementById('element-media-url');
        const addPBtn = document.getElementById('add-p-btn');
        const addBtnBtn = document.getElementById('add-btn-btn');
        const addImgBtn = document.getElementById('add-img-btn');
        const bgColorInput = document.getElementById('bg-color');
        const textColorInput = document.getElementById('text-color');
        const fontFamilySelect = document.getElementById('font-family-select');
        const fontSizeSlider = document.getElementById('font-size-slider');
        const copyBtn = document.getElementById('copy-btn');
        const templateContainer = document.getElementById('template-container');

        // Muuntaa RGB-värit HEX-muotoon säätimiä varten
        function rgbToHex(rgb) {
            if (!rgb || rgb === 'rgba(0, 0, 0, 0)' || rgb === 'transparent') return '#ffffff';
            const rgbValues = rgb.match(/\d+/g);
            if (!rgbValues) return '#ffffff';
            return "#" + rgbValues.slice(0, 3).map(x => {
                const hex = parseInt(x).toString(16);
                return hex.length === 1 ? "0" + hex : hex;
            }).join("");
        }

        // Elementin valinta ja säätimien aktivointi
        function selectElement(el) {
            if (isPreviewMode) return;

            if (selectedElement) {
                selectedElement.classList.remove('selected');
            }

            selectedElement = el;
            selectedElement.classList.add('selected');

            selectedInfo.textContent = el.getAttribute('data-name') || el.tagName;
            deleteBtn.disabled = false;
            addPBtn.disabled = false;
            addBtnBtn.disabled = false;
            addImgBtn.disabled = false;
            bgColorInput.disabled = false;
            textColorInput.disabled = false;
            fontFamilySelect.disabled = false;
            fontSizeSlider.disabled = false;

            const computedStyle = window.getComputedStyle(el);
            bgColorInput.value = rgbToHex(computedStyle.backgroundColor);
            textColorInput.value = rgbToHex(computedStyle.color);
            
            const currentFont = computedStyle.fontFamily.replace(/['"]/g, '');
            let foundFont = 'inherit';
            Array.from(fontFamilySelect.options).forEach(opt => {
                if(opt.value !== 'inherit' && currentFont.includes(opt.value.replace(/['"]/g, '').split(','))) {
                    foundFont = opt.value;
                }
            });
            fontFamilySelect.value = foundFont;
            fontSizeSlider.value = parseInt(computedStyle.fontSize) || 16;
        }

        // Valinnan tyhjennys
        function clearSelection() {
            if (selectedElement) {
                selectedElement.classList.remove('selected');
            }
            selectedElement = null;
            selectedInfo.textContent = "Ei valittu";
            deleteBtn.disabled = true;
            addPBtn.disabled = true;
            addBtnBtn.disabled = true;
            addImgBtn.disabled = true;
            bgColorInput.disabled = true;
            textColorInput.disabled = true;
            fontFamilySelect.disabled = true;
            fontSizeSlider.disabled = true;
        }

        // Klikkaustapahtuma esikatselualueen elementeille
        if (templateContainer) {
            templateContainer.addEventListener('click', (e) => {
                if (isPreviewMode) return;
                const target = e.target.closest('.editable');
                if (target) {
                    e.stopPropagation();
                    selectElement(target);
                }
            });
        }

        // Klikkaus tyhjään tilaan nollaa valinnan
        const previewArea = document.getElementById('preview-area');
        if (previewArea) {
            previewArea.addEventListener('click', (e) => {
                if (e.target === previewArea) {
                    clearSelection();
                }
            });
        }

        // Liukusäätimien ja värien päivitykset elementtiin
        bgColorInput.addEventListener('input', () => {
            if (selectedElement) selectedElement.style.backgroundColor = bgColorInput.value;
        });

        textColorInput.addEventListener('input', () => {
            if (selectedElement) selectedElement.style.color = textColorInput.value;
        });

        fontFamilySelect.addEventListener('change', () => {
            if (selectedElement) selectedElement.style.fontFamily = fontFamilySelect.value;
        });

        fontSizeSlider.addEventListener('input', () => {
            if (selectedElement) selectedElement.style.fontSize = `${fontSizeSlider.value}px`;
        });

        // Elementin poistaminen
        deleteBtn.addEventListener('click', () => {
            if (selectedElement) {
                selectedElement.remove();
                clearSelection();
            }
        });

        // Uuden elementin luomisen apufunktio
        function createEditableElement(tag, name, text = '') {
            const el = document.createElement(tag);
            el.classList.add('editable');
            el.setAttribute('data-name', name);
            if (tag !== 'img') {
                el.setAttribute('contenteditable', 'true');
                el.textContent = text;
            }
            return el;
        }

        // Uuden tekstin lisääminen
        addPBtn.addEventListener('click', () => {
            if (!selectedElement) return;
            const p = createEditableElement('p', 'Teksti', 'Uusi muokattava tekstikappale.');
            selectedElement.appendChild(p);
            selectElement(p);
        });

        // Uuden painikkeen lisääminen
        addBtnBtn.addEventListener('click', () => {
            if (!selectedElement) return;
            const btn = createEditableElement('a', 'Painike', 'Uusi painike');
            btn.className = 'custom-button editable';
            btn.setAttribute('href', '#');
            selectedElement.appendChild(btn);
            selectElement(btn);
        });

        // Uuden kuvan lisääminen
        addImgBtn.addEventListener('click', () => {
            if (!selectedElement) return;
            const url = elementMediaUrl.value.trim() || 'https://unsplash.com';
            const img = createEditableElement('img', 'Kuva');
            img.className = 'custom-image editable';
            img.src = url;
            selectedElement.appendChild(img);
            elementMediaUrl.value = '';
            selectElement(img);
        });

        // Esikatselutilan vaihto päälle ja pois
        previewModeBtn.addEventListener('click', () => {
            isPreviewMode = !isPreviewMode;
            if (isPreviewMode) {
                clearSelection();
                document.body.classList.add('preview-mode');
                previewModeBtn.textContent = 'Esikatselu: PÄÄLLÄ';
                previewModeBtn.classList.add('active');
                document.querySelectorAll('[contenteditable]').forEach(el => el.setAttribute('contenteditable', 'false'));
            } else {
                document.body.classList.remove('preview-mode');
                previewModeBtn.textContent = 'Esikatselu: POIS';
                previewModeBtn.classList.remove('active');
                document.querySelectorAll('.editable:not(img)').forEach(el => el.setAttribute('contenteditable', 'true'));
            }
        });

        // Puhdistetun HTML-koodin kerääminen ilman editorin omia luokkia
        function getCleanHTML() {
            if (!templateContainer) return '';
            const clone = templateContainer.cloneNode(true);
            const clean = (el) => {
                el.classList.remove('editable', 'selected');
                el.removeAttribute('data-name');
                el.removeAttribute('contenteditable');
                if (el.classList.length === 0) el.removeAttribute('class');
                Array.from(el.children).forEach(clean);
            };
            clean(clone);
            return clone.innerHTML;
        }

        // Kopiointitoiminto
        copyBtn.addEventListener('click', () => {
            const cleanHTML = getCleanHTML();
            navigator.clipboard.writeText(cleanHTML).then(() => {
                const originalText = copyBtn.textContent;
                copyBtn.textContent = 'Kopioitu!';
                copyBtn.style.backgroundColor = '#2ecc71';
                setTimeout(() => {
                    copyBtn.textContent = originalText;
                    copyBtn.style.backgroundColor = '#3498db';
                }, 2000);
            }).catch(err => {
                alert('Kopiointi epäonnistui: ', err);
            });
        });

    </style>
</head>
<body>

    <div id="control-panel">
        <h2>Sivunmuokkaus</h2>
        
        <div class="tool-group">
            <button id="preview-mode-btn">Esikatselu: POIS</button>
        </div>
        
        <div class="tool-group">
            <label>Valittu elementti:</label>
            <div id="selected-info" style="font-weight: bold; color: #2ecc71;">Ei valittu</div>
            <button id="delete-btn" disabled>Poista elementti</button>
        </div>

        <div class="tool-group" style="border-top: 1px solid #34495e; padding-top: 10px;">
            <label>Lisää uusi elementti valitun sisään:</label>
            <input type="text" id="element-media-url" placeholder="Kuvan URL (jos lisäät kuvan)">
            <div class="grid-btns">
                <button class="btn-add" id="add-p-btn" disabled>+ Teksti</button>
                <button class="btn-add" id="add-btn-btn" disabled>+ Painike</button>
            </div>
            <button class="btn-add" id="add-img-btn" disabled style="width:100%;">+ Kuva</button>
        </div>

        <div class="tool-group" style="border-top: 1px solid #34495e; padding-top: 10px;">
            <label for="bg-color">Taustaväri:</label>
            <input type="color" id="bg-color" disabled>
        </div>

        <div class="tool-group">
            <label for="text-color">Tekstin väri:</label>
            <input type="color" id="text-color" disabled>
        </div>

        <div class="tool-group">
            <label for="font-family-select">Fonttiperhe:</label>
            <select id="font-family-select" disabled>
                <option value="inherit">Oletus (Periytyvä)</option>
                <option value="'Segoe UI', Tahoma, Geneva, Verdana, sans-serif">Segoe UI / Sans-Serif</option>
                <option value="Georgia, serif">Georgia / Serif</option>
                <option value="'Courier New', Courier, monospace">Courier New / Monospace</option>
                <option value="'Arial Black', Gadget, sans-serif">Arial Black</option>
                <option value="'Comic Sans MS', cursive">Comic Sans</option>
            </select>
        </div>

        <div class="tool-group">
            <label for="font-size-slider">Tekstin koko:</label>
            <input type="range" id="font-size-slider" min="10" max="80" value="16" disabled>
        </div>

        <div class="btn-group">
            <button id="copy-btn">Kopioi HTML koodi</button>
        </div>
    </div>

</body>
</html>
